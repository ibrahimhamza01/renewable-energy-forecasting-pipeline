# Wind turbine model configuration
# Layer 6 Part A: wind power curve and theoretical power logic

turbine:
  name: generic_utility_scale
  description: >
    Generic utility-scale wind turbine used for normalized wind energy
    potential analysis. This is not a turbine-specific production model.

  cut_in_speed_ms: 3.5
  rated_speed_ms: 13.0
  cut_out_speed_ms: 25.0

  air_density_kg_m3: 1.225
  hub_height_m: 80

power_curve:
  curve_type: cubic_normalized_with_cut_in_offset
  output_col: normalized_power
  output_scale: 1.0

physics:
  wind_power_classes:
    class_1_max: 4.4
    class_2_max: 5.1
    class_3_max: 5.6
    class_4_max: 6.0
    class_5_max: 6.4
    class_6_max: 7.0

analysis:
  min_valid_wind_speed_ms: 0.0
  max_valid_wind_speed_ms: 120.0
  min_hourly_obs_per_day: 6
  min_daily_obs_per_month: 15